name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 20, 22, 24]
    name: node ${{ matrix.node }} / ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # 本项目零依赖，不需要 npm install
      #
      # ⚠ 这段踩过坑（v1.0.0 首跑 6 个 job 全挂在这）：
      #   原来写的是 shell 变量比较 `if [ "$deps" != "0" ]`，
      #   Node 18/20 上 node -e 的输出可能带换行/被 shell 吞掉，比较就永远为真。
      #   → 改成让 node 自己判断 exit code，不经过 shell 字符串比较。
      - name: 确认零依赖
        run: node scripts/check-zero-deps.mjs

      - name: 语法检查
        shell: bash
        run: |
          for f in src/*.js scripts/*.mjs examples/*.mjs tests/*.mjs; do
            node --check "$f" || exit 1
          done

      - name: 单元测试
        run: node --test "tests/*.test.mjs"

      - name: 端到端 demo
        run: node examples/demo.mjs

      - name: 词表可用性
        run: node scripts/check-lexicon.mjs
