name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 20, 22, 24]
    name: node ${{ matrix.node }} / ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # 本项目零依赖，不需要 npm install
      #
      # ⚠ 为什么这步写成独立脚本而不是 shell 一行：
      #   最早写的是 `deps=$(node -e "...")` 然后 `[ "$deps" != "0" ]`，
      #   在 Node 18/20 的 runner 上会误报（6 个 job 全挂在一个本该通过的检查上）。
      #   改成 node 脚本自己定 exit code，不经过 shell 字符串比较。
      - name: 确认零依赖
        run: node scripts/check-zero-deps.mjs

      - name: 语法检查
        shell: bash
        run: |
          for f in src/*.js scripts/*.mjs examples/*.mjs tests/*.mjs; do
            node --check "$f" || exit 1
          done

      - name: 单元测试
        run: npm test

      - name: 端到端 demo
        run: node examples/demo.mjs

      - name: 词表可用性
        run: node scripts/check-lexicon.mjs
